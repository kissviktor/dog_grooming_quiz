<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kutyakozmetikus kvíz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light dark;--bg:#f7f6f2;--card:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#d9d6cc;--ac:#2f6f5e;--act:#fff;--ok:#1d7a46;--okb:#e0f2e7;--no:#b3261e;--nob:#fbe4e2}
@media (prefers-color-scheme:dark){:root{--bg:#161a19;--card:#1f2524;--tx:#e8ecea;--mu:#9aa5a1;--bd:#35403d;--ac:#5fb59f;--act:#0e1514;--ok:#7bd69e;--okb:#1c3a2a;--no:#f2877f;--nob:#3f2220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
h1{font-size:19px;margin:0}#sc{color:var(--mu);font-size:13px;text-align:right}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.pic{background:var(--bg);border-radius:10px;min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mu);margin-bottom:12px;overflow:hidden}
.pic img{width:100%;max-height:340px;object-fit:contain;display:block}
label,legend{font-size:13px;color:var(--mu);display:block;margin:0 0 5px;padding:0}
fieldset{border:0;margin:12px 0 0;padding:0}
input{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.o{font:inherit;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);cursor:pointer;text-align:left}
.o.sel{border-color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac)}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.no{background:var(--nob);border-color:var(--no)}
.go{font:inherit;width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--act);font-weight:600;cursor:pointer}
.res{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.res b.ok{color:var(--ok)}.res b.no{color:var(--no)}
.rst{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:18px}
input.ok{border-color:var(--ok);background:var(--okb)}input.no{border-color:var(--no);background:var(--nob)}
</style>
</head>
<body>
<div class="w">
  <header><h1>Kutyakozmetikus kvíz</h1><div id="sc"></div></header>
  <div id="app" class="card">Betöltés…</div>
  <button class="rst" id="rst">Eredmények nullázása</button>
</div>
<script>
const $=s=>document.querySelector(s),SK='kviz_stat';
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[\s\-.’']/g,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D,cur,last=null,pick={},done=false,st={n:0,pts:0,b:{}};
try{const s=JSON.parse(localStorage.getItem(SK));if(s&&s.b)st=s}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(st))}catch(e){}};

async function init(){
  try{const r=await fetch('kutyafajtak.json');if(!r.ok)throw 0;D=await r.json()}
  catch(e){$('#app').textContent='Az adatbázis nem tölthető be. Az első indításhoz internetkapcsolat kell.';return}
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  next();warm();
}

// A képek háttérben, kis csomagokban letöltődnek, így később internet nélkül is megvannak.
async function warm(){
  const l=D.breeds.map(b=>b.image);
  for(let i=0;i<l.length;i+=5)await Promise.all(l.slice(i,i+5).map(u=>fetch(u).catch(()=>{})));
}

function score(){
  $('#sc').innerHTML=st.n?`${st.n} kérdés<br>${st.pts} / ${st.n*3} pont (${Math.round(st.pts/(st.n*3)*100)}%)`:'';
}

// A gyakrabban eltévesztett fajták nagyobb eséllyel jönnek elő.
function next(){
  const w=D.breeds.map(b=>b.id===last?0:1+2*Math.max(0,(st.b[b.id]?.bad||0)-(st.b[b.id]?.ok||0)));
  let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;
  while(i<w.length-1&&(r-=w[i])>=0)i++;
  cur=D.breeds[i];last=cur.id;pick={};done=false;score();
  const grp=(k,o)=>`<div class="opts" data-k="${k}">`+Object.entries(o).map(([v,l])=>`<button class="o" data-v="${esc(v)}">${esc(l)}</button>`).join('')+'</div>';
  $('#app').innerHTML=`
  <div class="pic"><img id="im" alt="Melyik kutyafajta ez?" src="${esc(cur.image)}" hidden onload="this.hidden=false;$('#ph').hidden=true" onerror="this.hidden=true;$('#ph').hidden=false"><div id="ph"><div style="font-size:48px">🐕</div>A kép még nem érhető el<br>ehhez a fajtához</div></div>
  <label for="nm">Mi a kutya fajtája?</label><input id="nm" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <fieldset><legend>Szőrzet típusa</legend>${grp('coat',D.meta.coat_types)}</fieldset>
  <fieldset><legend>Kozmetikai eljárás</legend>${grp('gr',D.meta.grooming_procedures)}</fieldset>
  <button class="go" id="go">Ellenőrzés</button>`;
}

function check(){
  done=true;
  const nm=$('#nm'),nOk=cur.accepted_names.some(n=>norm(n)===norm(nm.value)),
        cOk=pick.coat===cur.coat_type,gOk=pick.gr===cur.grooming_procedure,pts=nOk+cOk+gOk;
  nm.disabled=true;nm.classList.add(nOk?'ok':'no');
  document.querySelectorAll('.o').forEach(b=>{
    const k=b.parentNode.dataset.k,right=k==='coat'?cur.coat_type:cur.grooming_procedure;
    b.disabled=true;b.classList.remove('sel');
    if(b.dataset.v===right)b.classList.add('ok');else if(b.dataset.v===pick[k])b.classList.add('no');
  });
  const m=(ok,t)=>`<b class="${ok?'ok':'no'}">${ok?'✓':'✗'}</b> ${t}`;
  const alt=cur.accepted_names.slice(0,4).map(esc).join(', ');
  const h=document.createElement('div');h.className='res';
  h.innerHTML=`<b>${pts} / 3 pont</b><br>${m(nOk,'Fajta: <b>'+esc(cur.name)+'</b>'+(nOk?'':'<br><small>Elfogadott írásmódok: '+alt+'</small>'))}<br>${m(cOk,'Szőrzet: '+esc(D.meta.coat_types[cur.coat_type]))}<br>${m(gOk,'Eljárás: '+esc(D.meta.grooming_procedures[cur.grooming_procedure]))}`;
  $('#go').before(h);$('#go').textContent='Következő kérdés';
  const s=st.b[cur.id]||(st.b[cur.id]={ok:0,bad:0});pts===3?s.ok++:s.bad++;
  st.n++;st.pts+=pts;save();score();
}

$('#app').addEventListener('click',e=>{
  const o=e.target.closest('.o');
  if(o&&!done){const g=o.parentNode;g.querySelectorAll('.o').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');pick[g.dataset.k]=o.dataset.v;return}
  if(e.target.id==='go')done?(next(),scrollTo(0,0)):check();
});
$('#rst').onclick=()=>{if(confirm('Biztosan törlöd az eddigi eredményeidet?')){st={n:0,pts:0,b:{}};save();score()}};
init();
</script>
</body>
</html>
